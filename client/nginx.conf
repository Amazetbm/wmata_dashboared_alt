server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api to the Express service
    location /api/ {
        proxy_pass         http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Raised for /api/assistant/chat — tool-calling loops can take up to ~60s.
        # Also required for SSE when streaming is added (v2).
        proxy_read_timeout 120s;

        # SSE readiness (harmless for regular JSON responses)
        proxy_buffering off;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    location /mcp {
        proxy_pass          http://mcp:3001/mcp;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    Authorization     $http_authorization;
        proxy_set_header    Mcp-Session-Id    $http_mcp_session_id;
        proxy_buffering     off;
        proxy_read_timeout  120s;
        add_header          Cache-Control no-cache;
    }

    # Angular routing — fall back to index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compress text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
